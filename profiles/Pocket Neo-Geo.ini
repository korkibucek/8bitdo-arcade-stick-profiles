[Description]
Description=Analogue Pocket - Neo-Geo (Jotego core). Mirrors a real Neo-Geo cabinet: a single horizontal row of 4 buttons. Bottom row A B R2 L2 = Neo A B C D (outputs A B Y X; the core reads X-input Y as C and X as D). Top face row (X Y L R) disabled so only the bottom row is live.
