<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="340" rx="14" fill="#14181f"/>
  <rect x="12" y="12" width="636" height="316" rx="10" fill="none" stroke="#2a303c" stroke-width="2"/>
  <text x="30" y="46" fill="#f5f5f5" font-size="19" font-weight="bold">8BitDo Arcade Stick &#8212; X-input physical layout</text>
  <text x="30" y="68" fill="#9aa4b2" font-size="12">Button names as the Ultimate Software shows them (X-input mode)</text>

  <!-- Joystick -->
  <circle cx="120" cy="180" r="46" fill="#232a36" stroke="#4a5568" stroke-width="3"/>
  <circle cx="120" cy="180" r="20" fill="#4a5568"/>
  <text x="120" y="252" fill="#9aa4b2" font-size="12" text-anchor="middle">Stick (D-Pad / L-Analog / R-Analog</text>
  <text x="120" y="268" fill="#9aa4b2" font-size="12" text-anchor="middle">via lever-mode switch)</text>

  <!-- Top row: X Y R L -->
  <circle cx="280" cy="138" r="34" fill="#4a5568"/><text x="280" y="146" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">X</text>
  <circle cx="368" cy="120" r="34" fill="#4a5568"/><text x="368" y="128" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">Y</text>
  <circle cx="456" cy="120" r="34" fill="#4a5568"/><text x="456" y="128" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">R</text>
  <circle cx="544" cy="130" r="34" fill="#4a5568"/><text x="544" y="138" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">L</text>

  <!-- Bottom row: A B R2 L2 -->
  <circle cx="280" cy="226" r="34" fill="#4a5568"/><text x="280" y="234" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">A</text>
  <circle cx="368" cy="208" r="34" fill="#4a5568"/><text x="368" y="216" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">B</text>
  <circle cx="456" cy="208" r="34" fill="#4a5568"/><text x="456" y="216" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">R2</text>
  <circle cx="544" cy="218" r="34" fill="#4a5568"/><text x="544" y="226" fill="#f5f5f5" font-size="20" font-weight="bold" text-anchor="middle">L2</text>

  <!-- Small buttons -->
  <circle cx="470" cy="290" r="12" fill="#333b49"/><text x="470" y="316" fill="#9aa4b2" font-size="11" text-anchor="middle">Select</text>
  <circle cx="520" cy="290" r="12" fill="#333b49"/><text x="520" y="316" fill="#9aa4b2" font-size="11" text-anchor="middle">Start</text>
  <circle cx="570" cy="290" r="12" fill="#333b49"/><text x="570" y="316" fill="#9aa4b2" font-size="11" text-anchor="middle">Home</text>
  <circle cx="620" cy="290" r="12" fill="#333b49"/><text x="620" y="316" fill="#9aa4b2" font-size="11" text-anchor="middle">&#9733; Turbo</text>
</svg>
