<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="320" rx="14" fill="#14181f"/>
  <rect x="12" y="12" width="636" height="296" rx="10" fill="none" stroke="#2a303c" stroke-width="2"/>
  <text x="30" y="46" fill="#f5f5f5" font-size="19" font-weight="bold">Pocket SNES &#8212; what each button does</text>
  <text x="30" y="68" fill="#9aa4b2" font-size="12">Big label = SNES button &#183; small label = physical button &#183; orange = remapped</text>

  <circle cx="120" cy="180" r="46" fill="#232a36" stroke="#4a5568" stroke-width="3"/>
  <circle cx="120" cy="180" r="20" fill="#4a5568"/>
  <text x="120" y="252" fill="#9aa4b2" font-size="12" text-anchor="middle">D-Pad</text>

  <!-- Top row -->
  <circle cx="280" cy="138" r="34" fill="#e2705a"/><text x="280" y="146" fill="#14181f" font-size="20" font-weight="bold" text-anchor="middle">Y</text>
  <text x="280" y="188" fill="#9aa4b2" font-size="11" text-anchor="middle">(X)</text>
  <circle cx="368" cy="120" r="34" fill="#e2705a"/><text x="368" y="128" fill="#14181f" font-size="20" font-weight="bold" text-anchor="middle">X</text>
  <text x="368" y="170" fill="#9aa4b2" font-size="11" text-anchor="middle">(Y)</text>
  <circle cx="456" cy="120" r="34" fill="#e2705a"/><text x="456" y="128" fill="#14181f" font-size="20" font-weight="bold" text-anchor="middle">L</text>
  <text x="456" y="170" fill="#9aa4b2" font-size="11" text-anchor="middle">(R)</text>
  <circle cx="544" cy="130" r="34" fill="#4a5568"/><text x="544" y="138" fill="#f5f5f5" font-size="16" font-weight="bold" text-anchor="middle">R2</text>
  <text x="544" y="180" fill="#9aa4b2" font-size="11" text-anchor="middle">(L) spare</text>

  <!-- Bottom row -->
  <circle cx="280" cy="226" r="34" fill="#e2705a"/><text x="280" y="234" fill="#14181f" font-size="20" font-weight="bold" text-anchor="middle">B</text>
  <text x="280" y="276" fill="#9aa4b2" font-size="11" text-anchor="middle">(A)</text>
  <circle cx="368" cy="208" r="34" fill="#e2705a"/><text x="368" y="216" fill="#14181f" font-size="20" font-weight="bold" text-anchor="middle">A</text>
  <text x="368" y="258" fill="#9aa4b2" font-size="11" text-anchor="middle">(B)</text>
  <circle cx="456" cy="208" r="34" fill="#e2705a"/><text x="456" y="216" fill="#14181f" font-size="20" font-weight="bold" text-anchor="middle">R</text>
  <text x="456" y="258" fill="#9aa4b2" font-size="11" text-anchor="middle">(R2)</text>
  <circle cx="544" cy="218" r="34" fill="#4a5568"/><text x="544" y="226" fill="#f5f5f5" font-size="16" font-weight="bold" text-anchor="middle">L2</text>
  <text x="544" y="268" fill="#9aa4b2" font-size="11" text-anchor="middle">(L2) spare</text>
