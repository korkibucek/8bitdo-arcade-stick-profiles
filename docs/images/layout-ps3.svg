<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="660" height="340" rx="14" fill="#14181f"/>
  <rect x="12" y="12" width="636" height="316" rx="10" fill="none" stroke="#2a303c" stroke-width="2"/>
  <text x="30" y="46" fill="#f5f5f5" font-size="19" font-weight="bold">PS3 (Bluetooth) &#8212; what each button does</text>
  <text x="30" y="68" fill="#9aa4b2" font-size="12">Big label = PS3 button &#183; small label = (physical / output sent) &#183; orange = remapped</text>

  <circle cx="120" cy="180" r="46" fill="#232a36" stroke="#4a5568" stroke-width="3"/>
  <circle cx="120" cy="180" r="20" fill="#4a5568"/>
  <text x="120" y="252" fill="#9aa4b2" font-size="12" text-anchor="middle">D-Pad (lever on DP)</text>

  <!-- Top row: Square Triangle R1 L1 -->
  <circle cx="280" cy="138" r="34" fill="#e2705a"/><text x="280" y="145" fill="#14181f" font-size="17" font-weight="bold" text-anchor="middle">&#9723;</text>
  <text x="280" y="188" fill="#9aa4b2" font-size="11" text-anchor="middle">(X / A)</text>
  <circle cx="368" cy="120" r="34" fill="#4a5568"/><text x="368" y="127" fill="#f5f5f5" font-size="17" font-weight="bold" text-anchor="middle">&#9651;</text>
  <text x="368" y="170" fill="#9aa4b2" font-size="11" text-anchor="middle">(Y / Y)</text>
  <circle cx="456" cy="120" r="34" fill="#4a5568"/><text x="456" y="128" fill="#f5f5f5" font-size="18" font-weight="bold" text-anchor="middle">R1</text>
  <text x="456" y="170" fill="#9aa4b2" font-size="11" text-anchor="middle">(R / R)</text>
  <circle cx="544" cy="130" r="34" fill="#4a5568"/><text x="544" y="138" fill="#f5f5f5" font-size="18" font-weight="bold" text-anchor="middle">L1</text>
  <text x="544" y="180" fill="#9aa4b2" font-size="11" text-anchor="middle">(L / L)</text>

  <!-- Bottom row: Cross Circle R2 L2 -->
  <circle cx="280" cy="226" r="34" fill="#e2705a"/><text x="280" y="234" fill="#14181f" font-size="18" font-weight="bold" text-anchor="middle">&#10005;</text>
  <text x="280" y="276" fill="#9aa4b2" font-size="11" text-anchor="middle">(A / B)</text>
  <circle cx="368" cy="208" r="34" fill="#e2705a"/><text x="368" y="215" fill="#14181f" font-size="17" font-weight="bold" text-anchor="middle">&#9711;</text>
  <text x="368" y="258" fill="#9aa4b2" font-size="11" text-anchor="middle">(B / X)</text>
  <circle cx="456" cy="208" r="34" fill="#e2705a"/><text x="456" y="216" fill="#14181f" font-size="18" font-weight="bold" text-anchor="middle">R2</text>
  <text x="456" y="258" fill="#9aa4b2" font-size="11" text-anchor="middle">(R2 / START)</text>
  <circle cx="544" cy="218" r="34" fill="#e2705a"/><text x="544" y="226" fill="#14181f" font-size="18" font-weight="bold" text-anchor="middle">L2</text>
  <text x="544" y="268" fill="#9aa4b2" font-size="11" text-anchor="middle">(L2 / SELECT)</text>

  <!-- Small buttons -->
  <circle cx="420" cy="300" r="12" fill="#e2705a"/><text x="420" y="326" fill="#9aa4b2" font-size="11" text-anchor="middle">Select (L3)</text>
  <circle cx="480" cy="300" r="12" fill="#e2705a"/><text x="480" y="326" fill="#9aa4b2" font-size="11" text-anchor="middle">Start (R3)</text>
  <circle cx="540" cy="300" r="12" fill="#333b49"/><text x="540" y="326" fill="#9aa4b2" font-size="11" text-anchor="middle">P1=Sel</text>
  <circle cx="595" cy="300" r="12" fill="#333b49"/><text x="595" y="326" fill="#9aa4b2" font-size="11" text-anchor="middle">P2=Start</text>
</svg>
